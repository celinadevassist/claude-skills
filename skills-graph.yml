# Skills dependency graph
#
# Single source of truth for ordering when applying skills to a project.
# The `project-skill-advisor` skill reads this file, cross-references against
# the project's actual code, and emits .project-skills.json with a topologically
# sorted list of recommendations.
#
# Schema:
#   skills:
#     <slug>:
#       type:               setup | audit | generative
#       category:           foundation | auth | data | ui | audit | ops
#       level:              integer (lower runs first), or null for `audit` skills
#       depends_on:         [<slug>, ...]
#       version:            integer (default 1; bump when behavior changes meaningfully)
#       description_short:  one-line summary for the recommender's UI
#
# Levels are advisory — they reflect real prerequisites, not aesthetic order.
# When `depends_on` is honored, level is mostly redundant; it exists so the UI
# can group skills visually (Level 0 = "everything starts here", Level 5 =
# "ship it").
#
# Versioning policy (read by project-skill-advisor for drift detection):
#   BUMP version when the skill:
#     - adds a new required step to its procedure
#     - adds a new file the skill writes
#     - adds a new field to the schema/sidecar the skill emits
#     - tightens a heuristic (stricter detection rules)
#   DO NOT BUMP for:
#     - typos, doc restructuring, "Pairs Well With" additions
#     - backward-compatible additive optional fields
#   When in doubt, bump — re-application is cheap; a quietly drifted project is expensive.
#   A missing `version:` field is treated as `version: 1` by the advisor.

version: 1
last_updated: "2026-08-29"

categories:
  foundation: "Module structure + base infrastructure"
  auth:       "Authentication + identity + audit trail"
  data:       "Database patterns + persistence"
  ui:         "Frontend UX patterns"
  audit:      "Code review tooling — can run anytime"
  ops:        "Deployment + operations"
  planning:   "Project planning + analysis — non-code insights"

skills:

  # ---------- Level 0: Foundation (no deps, run first) ----------

  monolith-setup:
    type: setup
    category: foundation
    level: 0
    depends_on: []
    description_short: "Backend serves React SPA from /public — one origin, one deploy unit"

  logging-setup:
    type: setup
    category: foundation
    level: 0
    depends_on: []
    description_short: "Structured JSON logging + file rotation + exception filter with full stack traces"

  # ---------- Level 1: Patterns that build on the foundation ----------

  nestjs-throttle:
    type: setup
    category: foundation
    level: 1
    depends_on: [monolith-setup]
    description_short: "Rate limiting that skips static assets and JWT users; protects auth + API-key routes"

  jwt-auth-admin-seeded:
    type: setup
    category: auth
    level: 1
    depends_on: [monolith-setup, logging-setup]
    description_short: "Drop-in JWT auth: login + refresh rotation, bcrypt, admin-seed script, AuthContext + ProtectedRoute"

  # ---------- Level 2: Auth-dependent + UI patterns ----------

  audit-log:
    type: setup
    category: auth
    level: 2
    depends_on: [jwt-auth-admin-seeded, logging-setup]
    description_short: "Append-only audit trail attributed by user; admin-only filterable UI with payload drawer"

  api-platform:
    type: setup
    category: auth
    level: 2
    depends_on: [jwt-auth-admin-seeded]
    description_short: "API key management + auto-generated API docs + dual auth (JWT + API key)"

  mantine-theme-discipline:
    type: setup
    category: ui
    level: 2
    depends_on: [monolith-setup]
    description_short: "No hardcoded shades; theme tokens only — prevents pages from breaking in dark mode"

  i18n-bilingual-rtl:
    type: setup
    category: ui
    level: 2
    depends_on: [monolith-setup]
    description_short: "EN+AR bilingual + RTL + Cairo+Inter font pairing + Arabic-safe PDF/Excel"

  realtime-feed-sse-or-socketio:
    type: setup
    category: ui
    level: 2
    depends_on: [jwt-auth-admin-seeded, monolith-setup]
    description_short: "SSE / Socket.IO live ticker for NestJS + React; replaces Refresh-button UX with a LIVE chip"

  # ---------- Level 3: UI sugar that benefits from earlier patterns ----------

  spotlight-cmdk:
    type: setup
    category: ui
    level: 3
    depends_on: [mantine-theme-discipline]
    description_short: "Cmd-K / Ctrl-K command palette with role-aware actions; pairs well after 5+ pages exist"

  pwa-setup:
    type: setup
    category: ui
    level: 3
    depends_on: [monolith-setup]
    description_short: "Installable PWA: manifest + maskable icons + service-worker shell-cache + Android/iOS install prompts"

  responsive-layout-discipline:
    type: setup
    category: ui
    level: 3
    depends_on: [mantine-theme-discipline]
    description_short: "Mantine breakpoint discipline: responsive Grid/SimpleGrid spans, ScrollArea for terminals/tables, no fixed widths"

  # ---------- Level 4: Operational surfaces (introspect the system) ----------

  pwa-desktop-site-guard:
    type: setup
    category: ui
    level: 4
    depends_on: [pwa-setup]
    description_short: "Guard installed PWA against Chrome's Desktop-site mode: detection + zoom simulation + useIsMobile migration"

  setup-guide-page:
    type: setup
    category: ops
    level: 4
    depends_on: [monolith-setup, jwt-auth-admin-seeded, logging-setup]
    description_short: "Admin-only /setup page with live checks (DB, proxy, systemd, env) + copy-paste reference snippets"

  # ---------- Level 5: Ship it (last setup step) ----------

  deployment-setup:
    type: setup
    category: ops
    level: 5
    depends_on: [monolith-setup]
    description_short: "Deploy onto an EXISTING Portainer + Nginx-Proxy-Manager server — Dockerfile + GH Actions CI/CD + Portainer stack (pick this when the host already exists; pick hetzner-monolith-deploy to stand up a NEW dedicated server)"

  hetzner-monolith-deploy:
    type: setup
    category: ops
    level: 5
    depends_on: [monolith-setup]
    description_short: "Stand up a NEW Hetzner/DO single server — Caddy auto-HTTPS, GH Actions multi-arch + Watchtower push-to-deploy, Prisma migrate-on-start, nightly B2 backups, MXroute SMTP (pick deployment-setup instead when the target host already runs Portainer + NPM)"

  single-host-systemd-deploy:
    type: setup
    category: ops
    level: 5
    depends_on: [monolith-setup]
    description_short: "Add a project to an EXISTING shared host running Caddy + sibling projects — no Docker, systemd unit (prod + dev) + Caddy reverse-proxy block + sslip.io subdomain + scripts/deploy.sh + actions-ssh CD (the mission-control / ems / cartflow / idea-keep pattern; sibling of deployment-setup and hetzner-monolith-deploy)"

  # The two skills below are siblings to the deploy trio above but target a different host model:
  # an EXISTING multi-tenant CloudPanel host (e.g. cloudpanel-1) running external WP/WooCommerce
  # sites, not a project-from-this-repo monolith. depends_on is empty for cloudpanel-site-add
  # because the CloudPanel host itself is external to this repo (no hetzner-cloudpanel-provision
  # skill yet); wp-bot-hardening's only repo prerequisite is cloudpanel-site-add.

  cloudpanel-site-add:
    type: setup
    category: ops
    level: 5
    depends_on: []
    description_short: "Add a WP/WooCommerce tenant to an EXISTING multi-tenant CloudPanel host (Hetzner) — Linux user + nginx vhost + DB (MySQL native or per-site MariaDB-Docker sidecar for Hostinger uca1400 collations) + WP files + optional Hostinger-migration mode (sslip.io alias + LE cert + wp-config overrides); pair wp-bot-hardening after"

  cloudflare-dns-setup:
    type: setup
    category: ops
    level: 5
    depends_on: []
    description_short: "Add a domain to Cloudflare and point A/CNAME at a new origin — preserves email DNS (MX/SPF/DKIM/DMARC) verbatim, grey-cloud by default for real client IPs; modes: greenfield + migrate-from-existing (auto-import via /scan endpoint then audit + clean); idempotent — re-run on a half-completed zone is safe; pair after cloudpanel-site-add"

  # ---------- Level 6: Post-deploy ops (hardening + migration drivers + backups) ----------

  wp-bot-hardening:
    type: setup
    category: ops
    level: 6
    depends_on: [cloudpanel-site-add]
    description_short: "Block ~25 scraper / AI-training / SEO crawlers at nginx (MJ12bot, PetalBot, Bytespider, GPTBot, ClaudeBot — keeps Googlebot/Bingbot/Applebot) + deny /xmlrpc.php + replace WP-cron-via-HTTP with /etc/cron.d 5-min runner; idempotent + marker-commented; run after cloudpanel-site-add"

  wp-migrate-guru-import:
    type: setup
    category: ops
    level: 6
    depends_on: [cloudpanel-site-add]
    description_short: "Drive the destination side of a Migrate Guru migration (Hostinger WP → CloudPanel) — verify sslip-alias-with-LE-cert destination, coach the source/destination migration-key handoff, watch DB for progress, detect known failures (uca1400 collation, partial-but-reachable, theme PHP fatals, security-plugin renamed login); run after cloudpanel-site-add (mode=migration), before wp-post-migration-fixup"

  nightly-backup-wp-cron:
    type: setup
    category: ops
    level: 6
    depends_on: [cloudpanel-site-add]
    description_short: "Install per-site nightly WP backups on a CloudPanel host — DB dump (handles both MySQL native and MariaDB-Docker sidecar transparently via wp-cli) + files tarball with cache exclusions, 7-day local retention, atomic cron file regeneration as source-of-truth; tolerant of tar 'file changed' warnings (real-world live-site footgun); run after cloudpanel-site-add"

  # ---------- Level 7: Post-migration cleanup (runs after DNS cutover) ----------

  wp-post-migration-fixup:
    type: setup
    category: ops
    level: 7
    depends_on: [wp-migrate-guru-import, cloudflare-dns-setup]
    description_short: "The 'after DNS cutover' sweep for a WP/WC migration — WooCommerce-safe two-pass wp search-replace (sslip→real-domain, --precise --skip-columns=guid), strips MIGRATION_TEMP_OVERRIDE from wp-config.php, reissues real Let's Encrypt cert for apex + www, flushes caches, smoke-tests HTTPS + cert chain + no-sslip-leftovers + email DNS; idempotent; run once `dig $DOMAIN @1.1.1.1` returns the new origin IP"

  # ---------- Audit skills: can run anytime, no level ordering ----------

  bulk-db-audit:
    type: audit
    category: audit
    level: null
    depends_on: []
    description_short: "Detects MongoDB loop-based DB calls; recommends bulkWrite / insertMany / $in queries"

  project-metadata-refiner:
    type: audit
    category: audit
    level: null
    depends_on: []
    version: 3
    description_short: "Audits package.json / README / og: tags / git history; emits .project-meta.json side-car"

  project-skill-advisor:
    type: audit
    category: audit
    level: null
    depends_on: []
    description_short: "Recommends which skills to apply to a project, in dependency-correct order; emits .project-skills.json"

  skill-graph-position-inferrer:
    type: audit
    category: audit
    level: null
    depends_on: []
    description_short: "Infers a new skill's correct skills-graph.yml entry (type / category / level / depends_on)"

  project-technical-analyzer:
    type: audit
    category: planning
    level: null
    depends_on: []
    description_short: "Business PRD -> prds/technical-prd.md + .project-technical-prd.json infra checklist"

  project-readiness-report:
    type: audit
    category: planning
    level: null
    depends_on: [project-metadata-refiner, project-skill-advisor, project-technical-analyzer]
    version: 1
    description_short: "Rolls up the three project side-cars into one 0-100 readiness score + headline + punch-list for portfolio tiles"

  skill-verification-runner:
    type: audit
    category: ops
    level: null
    depends_on: [project-skill-advisor]
    version: 1
    description_short: "Executes nextActions[] from .project-skills.json and stamps verified/verifiedAt per applied skill — runtime half of advisor v2"

  # When adding a new skill, append it here AND update README.md's table.
  # `scripts/lint-skills-graph.py` (run by .github/workflows/lint-skills-graph.yml
  # on every push + PR) will fail the build if a skill exists in the repo but
  # not in this file. Run the `skill-graph-position-inferrer` skill to get a
  # proposed entry instead of writing one by hand.
